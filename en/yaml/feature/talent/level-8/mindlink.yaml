effects:
    - effect: During a respite, you can choose a number of creatures up to your [Reason](scc:mcdm.heroes.v1/rule.character/reason) score who you have communicated with using your [Telepathic Speech](scc:mcdm.heroes.v1/feature.talent.level-1/telepathic-speech) feature, creating a telepathic link among all of you. Whenever a linked creature spends one or more [Recoveries](scc:mcdm.heroes.v1/rule.health/recoveries), each other linked creature can spend a [Recovery](scc:mcdm.heroes.v1/rule.health/recoveries).
