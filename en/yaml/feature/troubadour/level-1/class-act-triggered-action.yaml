        | Duelist   | [Riposte](scc:mcdm.heroes.v1/feature.ability.troubadour.level-1/riposte)                |
        | Virtuoso  | [Harmonize](scc:mcdm.heroes.v1/feature.ability.troubadour.level-1/harmonize)              |
