ability:
    cost: 11 Essence
    distance: Ranged 10
    effects:
        - effect: A size 5 tree appears in an unoccupied space within distance. The tree has 100 Stamina and can't be [force moved](scc:mcdm.heroes.v1/movement/forced-movement). You and any ally can touch the tree to use the Catch Breath maneuver as a free maneuver. Additionally, when you start your turn with line of effect to the tree, you can end one effect on yourself that is ended by a saving throw or that ends at the end of your turn, or you can stand up if you [are prone](scc:mcdm.heroes.v1/condition/prone). Each ally within distance also gains this benefit.
          name: Effect
    feature_type: ability
    flavor: You call forth one of the Great Tree's many splinters to provide for your every need.
    keywords:
        - Green
        - Magic
        - Ranged
    metadata:
        action_type: Main action
        content: "\n*You call forth one of the Great Tree's many splinters to provide for your every need.*\n\n| **Green, Magic, Ranged** | **Main action** |\n|--------------------------|----------------:|\n| **\U0001F4CF Ranged 10**         |  **\U0001F3AF Special** |\n\n**Effect:** A size 5 tree appears in an unoccupied space within distance. The tree has 100 Stamina and can't be [force moved](scc:mcdm.heroes.v1/movement/forced-movement). You and any ally can touch the tree to use the Catch Breath maneuver as a free maneuver. Additionally, when you start your turn with line of effect to the tree, you can end one effect on yourself that is ended by a saving throw or that ends at the end of your turn, or you can stand up if you [are prone](scc:mcdm.heroes.v1/condition/prone). Each ally within distance also gains this benefit.\n\nEach enemy who ends their turn within 3 squares of the tree is [restrained](scc:mcdm.heroes.v1/condition/restrained) until the end of their next turn. A creature [restrained](scc:mcdm.heroes.v1/condition/restrained) this way can use a main action to end the effect early."
