effects:
    - effect: "You have the following ability.\n\n###### Source of Earth Statblock\n\n>\n>**Source of Earth**\n>\n>|      Elemental      |           -            |      Level 8      |         BRUTE         |         EV -         |\n>|:-------------------:|:----------------------:|:-----------------:|:---------------------:|:--------------------:|\n>|    **2**<br>Size    |     **6**<br>Speed     | **45**<br>Stamina |  **5**<br>Stability   | **5**<br>Free Strike |\n>| **-**<br>Immunities | **[Burrow](scc:mcdm.heroes.v1/movement/burrow)**<br>Movement |                   | **-**<br>With Captain | **-**<br>Weaknesses  |\n>|   **+3**<br>Might   |   **+1**<br>Agility    | **-5**<br>Reason  |  **-5**<br>Intuition  |  **-3**<br>Presence  |\n>\n>> **Earthwalk**\n>>\n>> [Difficult terrain](scc:mcdm.heroes.v1/movement/difficult-terrain) composed of earth and stone doesn't cost the source extra movement.\n>\n>> **Tunneler**\n>>\n>> When the source burrows, they create a size 2 tunnel.\n>\n>> **Earth Harness**\n>>\n>> A creature that has the [Earth Accepts Me](scc:mcdm.heroes.v1/feature.ability.elementalist.level-3/earth-accepts-me) ability can use it as a free action to meld into the source.\n>\n>> **Boulder Bash**\n>>\n>> | **Melee, Ranged, Strike, Weapon** |                 **Signature** |\n>> |-----------------------------------|------------------------------:|\n>> | **\U0001F4CF Melee 2 or ranged 10**       | **\U0001F3AF One creature or object** |\n>>\n>> **Power Roll + 3:**\n>>\n>> - **≤11:** 5 damage; push 3\n>> - **12-16:** 9 damage; push 4\n>> - **17+:** 12 damage; push 5"
