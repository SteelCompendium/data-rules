effects:
    - effect: When a creature takes the [Disengage](scc:mcdm.heroes.v1/feature.trait.common.move-actions/disengage) move action, they can [shift](scc:mcdm.heroes.v1/movement/shifting) 1 square. Certain class features, kits, and other rules allow a creature to [shift](scc:mcdm.heroes.v1/movement/shifting) more than 1 square when they disengage. A creature who does so can break up their [shift](scc:mcdm.heroes.v1/movement/shifting) with their maneuver and main action however they wish.
