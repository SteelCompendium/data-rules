effects:
    - effect: You always carry a supply of smoke bombs to use for distractions and easy getaways. You can use the [Hide](scc:mcdm.heroes.v1/feature.common.maneuvers/hide) maneuver even if you are observed and don't initially have [cover](scc:mcdm.heroes.v1/rule.combat/cover) or [concealment](scc:mcdm.heroes.v1/rule.combat/concealment). When you do so, you can [shift](scc:mcdm.heroes.v1/movement/shifting) a number of squares equal to your [Agility](scc:mcdm.heroes.v1/rule.character/agility) score. If you end this movement with [cover](scc:mcdm.heroes.v1/rule.combat/cover) or [concealment](scc:mcdm.heroes.v1/rule.combat/concealment), you are automatically hidden.
