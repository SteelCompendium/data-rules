    usage: Main action
effects:
    - effect: "You have the following ability.\n\n###### Source of Earth Statblock\n\n>\n>**Source of Earth**\n>\n>|      Elemental      |           -            |      Level 8      |         BRUTE         |         EV -         |\n>|:-------------------:|:----------------------:|:-----------------:|:---------------------:|:--------------------:|\n>|    **2**<br>[Size](scc:mcdm.heroes.v1/rule.character/size)    |     **6**<br>[Speed](scc:mcdm.heroes.v1/rule.character/speed)     | **45**<br>[Stamina](scc:mcdm.heroes.v1/rule.health/stamina) |  **5**<br>[Stability](scc:mcdm.heroes.v1/rule.character/stability)   | **5**<br>[Free Strike](scc:mcdm.heroes.v1/feature.common.main-actions/free-strike) |\n>| **-**<br>Immunities | **[Burrow](scc:mcdm.heroes.v1/movement/burrow)**<br>Movement |                   | **-**<br>With Captain | **-**<br>Weaknesses  |\n>|   **+3**<br>[Might](scc:mcdm.heroes.v1/rule.character/might)   |   **+1**<br>[Agility](scc:mcdm.heroes.v1/rule.character/agility)    | **-5**<br>[Reason](scc:mcdm.heroes.v1/rule.character/reason)  |  **-5**<br>[Intuition](scc:mcdm.heroes.v1/rule.character/intuition)  |  **-3**<br>[Presence](scc:mcdm.heroes.v1/rule.character/presence)  |\n>\n>> **Earthwalk**\n>>\n>> [Difficult terrain](scc:mcdm.heroes.v1/movement/difficult-terrain) composed of earth and stone doesn't cost the source extra movement.\n>\n>> **Tunneler**\n>>\n>> When the source burrows, they create a [size](scc:mcdm.heroes.v1/rule.character/size) 2 tunnel.\n>\n>> **Earth Harness**\n>>\n>> A creature that has the [Earth Accepts Me](scc:mcdm.heroes.v1/feature.ability.elementalist.level-3/earth-accepts-me) ability can use it as a free action to meld into the source.\n>\n>> **Boulder Bash**\n>>\n>> | **[Melee](scc:mcdm.heroes.v1/rule.combat/melee), [Ranged](scc:mcdm.heroes.v1/rule.combat/ranged), [Strike](scc:mcdm.heroes.v1/rule.combat/strike), Weapon** |                 **Signature** |\n>> |-----------------------------------|------------------------------:|\n>> | **\U0001F4CF [Melee](scc:mcdm.heroes.v1/rule.combat/melee) 2 or [ranged](scc:mcdm.heroes.v1/rule.combat/ranged) 10**       | **\U0001F3AF One creature or object** |\n>>\n>> **[Power Roll](scc:mcdm.heroes.v1/rule.dice/power-roll) + 3:**\n>>\n>> - **≤11:** 5 damage; [push](scc:mcdm.heroes.v1/movement/forced-movement) 3\n>> - **12-16:** 9 damage; [push](scc:mcdm.heroes.v1/movement/forced-movement) 4\n>> - **17+:** 12 damage; [push](scc:mcdm.heroes.v1/movement/forced-movement) 5"
