effects:
    - effect: Whenever you use the [Knockback](scc:mcdm.heroes.v1/feature.common.maneuvers/knockback) or [Grab](scc:mcdm.heroes.v1/feature.common.maneuvers/grab) maneuver, you use [Intuition](scc:mcdm.heroes.v1/rule.character/intuition) instead of [Might](scc:mcdm.heroes.v1/rule.character/might) for the [power roll](scc:mcdm.heroes.v1/rule.dice/power-roll) and for determining if you can target creatures larger than you. Additionally, whenever you use the [Knockback](scc:mcdm.heroes.v1/feature.common.maneuvers/knockback) maneuver, you can choose to [slide](scc:mcdm.heroes.v1/movement/forced-movement) the target instead of [pushing](scc:mcdm.heroes.v1/movement/forced-movement) them.
