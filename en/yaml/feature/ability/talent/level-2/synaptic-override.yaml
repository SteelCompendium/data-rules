cost: 5 Clarity
distance: Ranged 10
effects:
    - roll: Power Roll + Reason
      tier1: The target makes a [free strike](scc:mcdm.heroes.v1/feature.common.main-actions/free-strike) against one enemy of your choice.
      tier2: The target shifts up to their speed and uses their signature ability against any enemies of your choice.
      tier3: The target moves up to their speed and uses their signature ability against any enemies of your choice.
    - effect: You control the target's movement. The target can't be moved in a way that would harm them (such as over a cliff), leave them [dying](scc:mcdm.heroes.v1/rule.health/dying), or result in them suffering a condition or other negative effect. However, you can move them to provoke opportunity attacks.
      name: Effect
