cost: 9 Clarity
distance: 4 cube within 10
effects:
    - roll: Power Roll + Presence
      tier1: P < WEAK, the target is [slowed](scc:mcdm.heroes.v1/condition/slowed) until the effect ends
      tier2: P < AVERAGE, the target's speed is 0 until the effect ends
      tier3: P < STRONG, the target is [restrained](scc:mcdm.heroes.v1/condition/restrained) until the effect ends
    - effect: The area is frozen in time until the start of your next turn. Each object in the area is [restrained](scc:mcdm.heroes.v1/condition/restrained) and can't fall until the effect ends. Until the effect ends, creatures in the area who are reduced to 0 Stamina or would die stay alive, and objects in the area that are reduced to 0 Stamina remain undestroyed.
      name: Effect
feature_type: ability
flavor: Keep everything as it was. Ignore everything that will be.
keywords:
    - Area
    - Chronopathy
    - Psionic
    - Ranged
metadata:
    action_type: Main action
    class: talent
    content: "\n*Keep everything as it was. Ignore everything that will be.*\n\n| **Area, Chronopathy, Psionic, Ranged** |                             **Main action** |\n|----------------------------------------|--------------------------------------------:|\n| **\U0001F4CF 4 cube within 10**                | **\U0001F3AF Each creature and object in the area** |\n\n**Effect:** The area is frozen in time until the start of your next turn. Each object in the area is [restrained](scc:mcdm.heroes.v1/condition/restrained) and can't fall until the effect ends. Until the effect ends, creatures in the area who are reduced to 0 Stamina or would die stay alive, and objects in the area that are reduced to 0 Stamina remain undestroyed.\n\nMake a power roll that targets each enemy in the area.\n\n**Power Roll + Presence:**\n\n- **≤11:** P < WEAK, the target is [slowed](scc:mcdm.heroes.v1/condition/slowed) until the effect ends\n- **12-16:** P < AVERAGE, the target's speed is 0 until the effect ends\n- **17+:** P < STRONG, the target is [restrained](scc:mcdm.heroes.v1/condition/restrained) until the effect ends\n\n**Strained:** Any creature or object [force moved](scc:mcdm.heroes.v1/movement/forced-movement) in the area takes 2 corruption damage for each square of the area they enter. Creatures and objects [restrained](scc:mcdm.heroes.v1/condition/restrained) in the area can be [force moved](scc:mcdm.heroes.v1/movement/forced-movement). You are [restrained](scc:mcdm.heroes.v1/condition/restrained) until the effect ends."
