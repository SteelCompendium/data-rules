content: "With this stormwight kit, you channel your primordial ferocity into the form of a rat, becoming mobile and elusive. Raden are associated with the wild nature of the rat, before cities became their habitat. This aspect is associated with the rat flood—a surge of corrupted water that draws forth hordes of rats.\n\n##### Signature Ability\n\n<!-- @type: ability | @subtype: signature -->\n######## Driving Pounce\n\n*Your enemies try in vain to fall back from your pouncing attack.*\n\n| **Melee, Strike, Weapon** |               **Main action** |\n|---------------------------|------------------------------:|\n| **\U0001F4CF Melee 1**            | **\U0001F3AF One creature or object** |\n\n**Power Roll + Agility:**\n\n- **≤11:** 4 + A damage\n- **12-16:** 7 + A damage; push 1\n- **17+:** 9 + A damage; push 2\n\n**Effect:** You can shift up to the same number of squares that you pushed the target."
name: Raden
scc: mcdm.heroes.v1/kit/raden
type: kit
