content: "The Sniper kit gives you the tools and techniques to take down enemies from afar. This kit can help you become the archer who lurks behind trees or down tunnels, picking off enemies with a bow or crossbow as they approach.\n\n##### Equipment\n\nYou wear no armor and wield a bow.\n\n##### Kit Bonuses\n\n**Speed Bonus:** +1\n\n**Ranged Damage Bonus:** +0/+0/+4\n\n**Ranged Distance Bonus:** +10\n\n**Disengage Bonus:** +1\n\n##### Signature Ability\n\n<!-- @type: ability | @subtype: signature -->\n######## Patient Shot\n\n*Breathe... aim... wait... then strike!*\n\n| **Ranged, Strike, Weapon** |     **Main action** |\n|----------------------------|--------------------:|\n| **\U0001F4CF Ranged 15**           | **\U0001F3AF One creature** |\n\n**Power Roll + Might or Agility:**\n\n- **≤11:** 3 + M or A damage\n- **12-16:** 6 + M or A damage\n- **17+:** 13 + M or A damage\n\n**Effect:** If you don't take a move action this turn, this strike deals extra damage equal to your Might or Agility score (your choice)."
name: Sniper
scc: mcdm.heroes.v1/kit/sniper
type: kit
