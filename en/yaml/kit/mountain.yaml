content: "The Mountain kit does exactly what it says on the tin. You don heavy armor and raise a heavy weapon to stand strong against your foes, quickly demolishing them when it's your turn to strike.\n\n##### Equipment\n\nYou wear heavy armor and wield a heavy weapon.\n\n##### Kit Bonuses\n\n**Stamina Bonus:** +9 per echelon\n\n**Stability Bonus:** +2\n\n**Melee Damage Bonus:** +0/+0/+4\n\n##### Signature Ability\n\n<!-- @type: ability | @subtype: signature -->\n######## Pain for Pain\n\n*An enemy who tagged you will pay for that.*\n\n| **Melee, Strike, Weapon** |     **Main action** |\n|---------------------------|--------------------:|\n| **\U0001F4CF Melee 1**            | **\U0001F3AF One creature** |\n\n**Power Roll + Might or Agility:**\n\n- **≤11:** 3 + M or A damage\n- **12-16:** 5 + M or A damage\n- **17+:** 13 + M or A damage\n\n**Effect:** If the target dealt damage to you since the end of your last turn, this strike deals additional damage equal to your Might or Agility score (your choice)."
