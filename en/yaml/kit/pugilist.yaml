content: "Meant for brawlers and boxers, the Pugilist kit gives you access to a melee fighting style that grants a boost to Stamina and damage while allowing you to float like a butterfly. If you want to be a tough, strong hero who doles out punishment with your fists, then this kit is for you.\n\n##### Equipment\n\nYou wear no armor and wield only your unarmed strikes.\n\n##### Kit Bonuses\n\n**Stamina Bonus:** +6 per echelon\n\n**Speed Bonus:** +2\n\n**Stability Bonus:** +1\n\n**Melee Damage Bonus:** +1/+1/+1\n\n##### Signature Ability\n\n<!-- @type: ability | @subtype: signature -->\n######## Let's Dance\n\n*Keeping your enemies stumbling around the battlefield is second nature to you.*\n\n| **Melee, Strike, Weapon** |     **Main action** |\n|---------------------------|--------------------:|\n| **\U0001F4CF Melee 1**            | **\U0001F3AF One creature** |\n\n**Power Roll + Might or Agility:**\n\n- **≤11:** 3 + M or A damage\n- **12-16:** 6 + M or A damage; slide 1\n- **17+:** 8 + M or A damage; slide 2\n\n**Effect:** You can shift into any square the target leaves after you slide them."
name: Pugilist
scc: mcdm.heroes.v1/kit/pugilist
type: kit
