content: "The Rapid-Fire kit is for archers who want to deal maximum damage by shooting as many arrows as possible into nearby enemies. With this kit, your fighting technique focuses on peppering foes before they can get close enough to counterattack.\n\n##### Equipment\n\nYou wear light armor and wield a bow.\n\n##### Kit Bonuses\n\n**Stamina Bonus:** +3 per echelon\n\n**Speed Bonus:** +1\n\n**Ranged Damage Bonus:** +2/+2/+2\n\n**Ranged Distance Bonus:** +7\n\n**Disengage Bonus:** +1\n\n##### Signature Ability\n\n<!-- @type: ability | @subtype: signature -->\n######## Two Shot\n\n*When you fire two arrows back-to-back, both hit their mark.*\n\n| **Ranged, Strike, Weapon** |                 **Main action** |\n|----------------------------|--------------------------------:|\n| **\U0001F4CF Ranged 12**           | **\U0001F3AF Two creatures or objects** |\n\n**Power Roll + Might or Agility:**\n\n- **≤11:** 4 damage\n- **12-16:** 6 damage\n- **17+:** 8 damage"
name: Rapid-Fire
scc: mcdm.heroes.v1/kit/rapid-fire
stat_bonuses:
    main-action: "\U0001F3AF Two creatures or objects"
    ranged-strike-weapon: "\U0001F4CF Ranged 12"
