content: "The Shining Armor kit provides the most protection a kit can afford, providing you with the sword, shield, and armor necessary to play the prototypical knight.\n\n##### Equipment\n\nYou wear heavy armor and wield a shield and a medium weapon.\n\n##### Kit Bonuses\n\n**Stamina Bonus:** +12 per echelon\n\n**Stability Bonus:** +1\n\n**Melee Damage Bonus:** +2/+2/+2\n\n##### Signature Ability\n\n<!-- @type: ability | @subtype: signature -->\n######## Protective Attack\n\n*The strength of your assault makes it impossible for your foe to ignore you.*\n\n| **Melee, Strike, Weapon** |     **Main action** |\n|---------------------------|--------------------:|\n| **\U0001F4CF Melee 1**            | **\U0001F3AF One creature** |\n\n**Power Roll + Might or Agility:**\n\n- **≤11:** 5 + M or A damage\n- **12-16:** 8 + M or A damage\n- **17+:** 11 + M or A damage\n\n**Effect:** The target is taunted until the end of their next turn."
