content: "Who says lightly armored heroes can't also be hard to move? You just need to employ some psionics! The [Battlemind](scc:mcdm.heroes.v1/kit/battlemind) kit harnesses the power of your mind to make you harder to move—and to make your foes easier to push around.\n\n##### Equipment\n\nYou wear light armor and wield a medium weapon.\n\n##### Kit Bonuses\n\n**[Stamina](scc:mcdm.heroes.v1/rule.health/stamina) Bonus:** +3 per [echelon](scc:mcdm.heroes.v1/rule.general/echelon)\n\n**[Speed](scc:mcdm.heroes.v1/rule.character/speed) Bonus:** +2\n\n**[Stability](scc:mcdm.heroes.v1/rule.character/stability) Bonus:** +1\n\n**Melee Damage Bonus:** +2/+2/+2\n\n##### Signature Ability\n\n###### Unmooring\n\n*Your weapon unleashes psionic energy that reduces your target's weight.*\n\n| **Melee, Psionic, [Strike](scc:mcdm.heroes.v1/rule.combat/strike), Weapon** |     **Main action** |\n|------------------------------------|--------------------:|\n| **\U0001F4CF Melee 1**                     | **\U0001F3AF One creature** |\n\n**[Power Roll](scc:mcdm.heroes.v1/rule.dice/power-roll) + [Might](scc:mcdm.heroes.v1/rule.character/might), [Reason](scc:mcdm.heroes.v1/rule.character/reason), [Intuition](scc:mcdm.heroes.v1/rule.character/intuition), or [Presence](scc:mcdm.heroes.v1/rule.character/presence):**\n\n- **≤11:** 5 + M, R, I, or P damage\n- **12-16:** 8 + M, R, I, or P damage\n- **17+:** 11 + M, R, I, or P damage\n\n**Effect:** Until the end of the target's next turn, any [forced movement](scc:mcdm.heroes.v1/movement/forced-movement) that affects the target has its [distance](scc:mcdm.heroes.v1/rule.combat/distance) increased by 2."
