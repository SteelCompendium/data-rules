content: "If you want to be mobile and deal a lot of damage with melee strikes, then you should reach for the Swashbuckler kit. This is a great kit for heroes who want to be master duelists.\n\n##### Equipment\n\nYou wear light armor and wield a medium weapon.\n\n##### Kit Bonuses\n\n**Stamina Bonus:** +3 per echelon\n\n**Speed Bonus:** +3\n\n**Melee Damage Bonus:** +2/+2/+2\n\n**Disengage Bonus:** +1\n\n##### Signature Ability\n\n<!-- @type: ability | @subtype: signature -->\n######## Fancy Footwork\n\n*All combat is a dance—and you'll be the one leading.*\n\n| **Melee, Strike, Weapon** |     **Main action** |\n|---------------------------|--------------------:|\n| **\U0001F4CF Melee 1**            | **\U0001F3AF One creature** |\n\n**Power Roll + Might or Agility:**\n\n- **≤11:** 5 + M or A damage\n- **12-16:** 7 + M or A damage; push 1\n- **17+:** 10 + M or A damage; push 2\n\n**Effect:** You can shift into any square the target leaves after you push them."
name: Swashbuckler
scc: mcdm.heroes.v1/kit/swashbuckler
