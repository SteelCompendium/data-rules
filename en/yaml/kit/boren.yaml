content: "With this stormwight kit, you channel your primordial ferocity into the form of a bear, becoming large, durable, and imposing. Boren are tied to the craggy, rocky north, and this aspect is associated with the blizzard's bitter cold.\n\n##### Signature Ability\n\n<!-- @type: ability | @subtype: signature -->\n######## Bear Claws\n\n*Attacks with your sharp and deadly claws grab the weak.*\n\n| **Melee, Strike, Weapon** |               **Main action** |\n|---------------------------|------------------------------:|\n| **\U0001F4CF Melee 1**            | **\U0001F3AF One creature or object** |\n\n**Power Roll + Might:**\n\n- **≤11:** 2 + M damage; M < WEAK, grabbed\n- **12-16:** 5 + M damage; M < AVERAGE, grabbed\n- **17+:** 11 + M damage; M < STRONG, grabbed"
name: Boren
scc: mcdm.heroes.v1/kit/boren
stat_bonuses:
    main-action: "\U0001F3AF One creature or object"
    melee-strike-weapon: "\U0001F4CF Melee 1"
type: kit
