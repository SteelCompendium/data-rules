content: "The Dual Wielder kit is for folks who want to excel at using two weapons at the same time. Your fighting style maximizes the power of each weapon you have in hand, making you a whirling dealer of death.\n\n##### Equipment\n\nYou wear medium armor and wield a light weapon and a medium weapon.\n\n##### Kit Bonuses\n\n**Stamina Bonus:** +6 per echelon\n\n**Speed Bonus:** +2\n\n**Melee Damage Bonus:** +2/+2/+2\n\n**Disengage Bonus:** +1\n\n##### Signature Ability\n\n<!-- @type: ability | @subtype: signature -->\n######## Double Strike\n\n*Why strike once when you could do it twice?*\n\n| **Melee, Strike, Weapon** |                 **Main action** |\n|---------------------------|--------------------------------:|\n| **\U0001F4CF Melee 1**            | **\U0001F3AF Two creatures or objects** |\n\n**Power Roll + Might or Agility:**\n\n- **≤11:** 4 damage\n- **12-16:** 6 damage\n- **17+:** 8 damage\n\n**Effect:** If you use this ability on your turn, you can use it against one target, then use your maneuver and your move action for that turn before using the ability against a second target. You still use the same power roll for both targets."
