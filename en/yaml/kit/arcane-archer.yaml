content: "The [Arcane Archer](scc:mcdm.heroes.v1/kit/arcane-archer) kit allows you to combine magic and ranged weapon [strikes](scc:mcdm.heroes.v1/rule.combat/strike). Your lack of armor keeps you mobile, and your magic makes your arrows explode to devastate your foes.\n\n##### Equipment\n\nYou wear no armor and wield a bow.\n\n##### Kit Bonuses\n\n**Speed Bonus:** +1\n\n**Ranged Damage Bonus:** +2/+2/+2\n\n**Ranged [Distance](scc:mcdm.heroes.v1/rule.combat/distance) Bonus:** +10\n\n**Disengage Bonus:** +1\n\n##### Signature Ability\n\n###### Exploding Arrow\n\n*Your ammunition explodes with magical energy.*\n\n| **Magic, Ranged, [Strike](scc:mcdm.heroes.v1/rule.combat/strike), Weapon** |               **Main action** |\n|-----------------------------------|------------------------------:|\n| **\U0001F4CF Ranged 15**                  | **\U0001F3AF One creature or object** |\n\n**Power Roll + [Agility](scc:mcdm.heroes.v1/rule.character/agility), [Reason](scc:mcdm.heroes.v1/rule.character/reason), [Intuition](scc:mcdm.heroes.v1/rule.character/intuition), or [Presence](scc:mcdm.heroes.v1/rule.character/presence):**\n\n- **≤11:** 5 + A, R, I, or P fire damage\n- **12-16:** 7 + A, R, I, or P fire damage\n- **17+:** 10 + A, R, I, or P fire damage\n\n**Effect:** One creature or object of your choice within 2 squares of the target takes fire damage equal to the [characteristic](scc:mcdm.heroes.v1/rule.character/characteristic) score used for this ability's power roll."
