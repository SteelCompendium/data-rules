content: "With this stormwight kit, you channel your [primordial ferocity](scc:mcdm.heroes.v1/feature.trait.fury.level-10/primordial-ferocity) into the form of a wolf, becoming a fleet-footed hunter. [Vuken](scc:mcdm.heroes.v1/kit/vuken) are tied to forests and open steppes, and this aspect is associated with the thunderstorm.\n\n##### Signature Ability\n\n###### Unbalancing Attack\n\n*A wild assault forces your foe onto their back.*\n\n| **Melee, Strike, Weapon** |               **Main action** |\n|---------------------------|------------------------------:|\n| **\U0001F4CF Melee 1**            | **\U0001F3AF One creature or object** |\n\n**Power Roll + Might:**\n\n- **≤11:** 4 + M damage; A < WEAK, prone\n- **12-16:** 7 + M damage; A < AVERAGE, prone\n- **17+:** 9 + M damage; A < STRONG, prone"
