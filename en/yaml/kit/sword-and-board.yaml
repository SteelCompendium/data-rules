content: "The [Sword and Board](scc:mcdm.heroes.v1/kit/sword-and-board) kit doesn't just give you a shield—it makes the shield part of your offensive arsenal. With a medium weapon in one hand and a block of steel or solid oak in the other, you protect yourself while you control the battlefield.\n\n##### Equipment\n\nYou wear medium armor and wield a shield and a medium weapon.\n\n##### Kit Bonuses\n\n**Stamina Bonus:** +9 per echelon\n\n**Stability Bonus:** +1\n\n**Melee Damage Bonus:** +2/+2/+2\n\n**Disengage Bonus:** +1\n\n##### Signature Ability\n\n###### Shield Bash\n\n*In your hands, a shield isn't just for protection.*\n\n| **Melee, Strike, Weapon** |     **Main action** |\n|---------------------------|--------------------:|\n| **\U0001F4CF Melee 1**            | **\U0001F3AF One creature** |\n\n**Power Roll + Might or Agility:**\n\n- **≤11:** 4 + M or A damage; push 1\n- **12-16:** 7 + M or A damage; push 2\n- **17+:** 9 + M or A damage; push 3; M < STRONG, prone"
