benefit: You have the following ability, which you can use as a ranged [free strike](scc:mcdm.heroes.v1/feature.common.main-actions/free-strike).
content: "You are the only survivor of a cataclysmic psionic event—an experiment gone wrong, a voiceless talker attack, or some naturally occurring phenomenon of a far-off part of the timescape. It left you with a psionic [talent](scc:mcdm.heroes.v1/class/talent), but also made you vulnerable to telepathic attacks.\n\n**Benefit:** You have the following ability, which you can use as a ranged [free strike](scc:mcdm.heroes.v1/feature.common.main-actions/free-strike).\n\n##### Telekinetic Grasp\n\n>\n> *You reach out with your mind to move a creature or object.*\n>\n> | **Psionic, Ranged, Strike**   |                  **Maneuver** |\n> |-------------------------------|------------------------------:|\n> | **\U0001F4CF Ranged 10**              | **\U0001F3AF One creature or object** |\n>\n> **Power Roll + Might, Intuition, or Presence:**\n>\n> - **≤11:** Push or pull 1\n> - **12-16:** Push or pull 2\n> - **17+:** Push or pull 3\n\n**Drawback:** You have psychic weakness 5."
drawback: You have psychic weakness 5.
