content: "*Kneel, heroes. Arise, knights of Tor, and may your swords be ever sharp in our service.*\n\n**Prerequisite:** A [noble](scc:mcdm.heroes.v1/title/noble) or [monarch](scc:mcdm.heroes.v1/title/monarch) grants you knighthood or a similar rank.\n\n**Effect:** Choose one of the following benefits:\n\n- *Heraldic Fame:* You earn 1 Renown.\n- *Knightly Aegis:* Your Stamina maximum increases by 6.\n- *Knightly Challenge:* You have the following ability, which can be paid for using the Heroic Resource of your class.\n\n##### Knightly Challenge (5 Heroic Resource)\n\n>\n> *Have at thee!*\n>\n> | **Melee, Strike, Weapon** |     **Main action** |\n> |---------------------------|--------------------:|\n> | **\U0001F4CF Melee 1**            | **\U0001F3AF One creature** |\n>\n> **Power Roll + Might or Agility:**\n>\n> - **≤11:** 7 damage; [taunted](scc:mcdm.heroes.v1/condition/taunted) (save ends)\n> - **12-16:** 11 damage; [taunted](scc:mcdm.heroes.v1/condition/taunted) (save ends)\n> - **17+:** 16 damage; [taunted](scc:mcdm.heroes.v1/condition/taunted) (save ends)\n>\n> **Effect:** You can end the [taunted](scc:mcdm.heroes.v1/condition/taunted) condition on the target as a free maneuver.\n>\n> **Special:** If you take this title, you might occasionally be called upon to perform duties for the person who knighted you."
effect: 'Choose one of the following benefits:'
name: Knight
prerequisite: A [noble](scc:mcdm.heroes.v1/title/noble) or [monarch](scc:mcdm.heroes.v1/title/monarch) grants you knighthood or a similar rank.
