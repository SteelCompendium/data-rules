content: "*When I saw the bloodstained manuscript under Fellwander's arm, I knew his quest for the Opera was over—and with it, his chance for redemption.*\n\n**Prerequisite:** You visit the realms of gods, [devils](scc:mcdm.heroes.v1/ancestry/devil), or other immortal beings and hear a note of the Music of Creation.\n\n**Effect:** Choose one of the following benefits:\n\n- *Angelic Chorus:* You can use the lessons of musical improvisation in combat. Choose one class act triggered action from the [troubadour](scc:mcdm.heroes.v1/class/troubadour) class. You gain that ability regardless of whether your class and subclass allow you to take it. If this ability allows you to gain or spend drama, you can gain or spend the [Heroic Resource](scc:mcdm.heroes.v1/rule.resource/heroic-resource) of your class in place of drama.\n- *Devil's Opera:* You have the following ability, which can be paid for using the [Heroic Resource](scc:mcdm.heroes.v1/rule.resource/heroic-resource) of your class.\n\n##### The Devil's Chord (9 Heroic Resource)\n\n>\n> *Helloooo Orden!*\n>\n> | **Area, Magic** |                  **Main action** |\n> |-----------------|---------------------------------:|\n> | **\U0001F4CF 5 burst**  | **\U0001F3AF Each creature in the area** |\n>\n> **Power Roll + Presence:**\n>\n> - **≤11:** You take 4 sonic damage unless you have the Performance skill.\n> - **12-16:** 6 sonic damage; M < AVERAGE, [weakened](scc:mcdm.heroes.v1/condition/weakened) (save ends)\n> - **17+:** 10 sonic damage; M < STRONG, [weakened](scc:mcdm.heroes.v1/condition/weakened) and [bleeding](scc:mcdm.heroes.v1/condition/bleeding) (save ends)\n>\n> **Effect:** The soul of any creature killed by this ability is dragged to Hell.\n\n- *Music of the Spheres:* As a main action, you sing or play a note as delicate and sharp as glass—and just as easily shattered. Until the start of your next turn, whenever a creature within 10 squares makes a strike, they take 8 sonic damage. Whenever you make a strike during that same period, you also take 8 sonic damage."
effect: 'Choose one of the following benefits:'
name: Maestro
prerequisite: You visit the realms of gods, [devils](scc:mcdm.heroes.v1/ancestry/devil), or other immortal beings and hear a note of the Music of Creation.
